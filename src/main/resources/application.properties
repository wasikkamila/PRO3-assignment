spring.application.name=slaughterhouse-grpc

# gRPC server port (9090 is the default)
spring.grpc.server.port=9090

# Central Traceability Store (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/slaughterhouse
spring.datasource.username=postgres
spring.datasource.password=postgres

# Run schema.sql and data.sql on start-up (demo data)
spring.sql.init.mode=always
