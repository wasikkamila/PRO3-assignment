spring.application.name=slaughterhouse-grpc-test

# gRPC server port used by the end-to-end test (different from 9090 so it does not clash with a running app)
spring.grpc.server.port=9091

# In-memory H2 database (PostgreSQL mode) instead of the real PostgreSQL server
spring.datasource.url=jdbc:h2:mem:slaughterhouse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same schema.sql and data.sql as the application
spring.sql.init.mode=always
